name: Publish macOS release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Also publish the biocontext package to npm'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source
        run: |
          bun run check:all
          bun run test:all

      - name: Build macOS binaries
        run: bun run build
        env:
          BIOCONTEXT_TARGETS: bun-darwin-arm64,bun-darwin-x64

      - name: Verify distribution
        run: bun run scripts/verify-dist.ts
        working-directory: apps/tui

      - name: Create checksums
        run: shasum -a 256 * > SHA256SUMS.txt
        working-directory: apps/tui/dist

      - name: Upload distribution
        uses: actions/upload-artifact@v4
        with:
          name: biocontext-macos
          path: apps/tui/dist/*

  github-release:
    runs-on: macos-14
    needs: build-macos
    steps:
      - uses: actions/checkout@v4

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: biocontext-macos
          path: dist

      - name: Read version
        id: version
        run: echo "version=$(jq -r '.version' apps/tui/package.json)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            dist/* \
            --title "biocontext v${{ steps.version.outputs.version }}" \
            --generate-notes

  npm-publish:
    if: ${{ inputs.publish_npm }}
    runs-on: macos-14
    needs: build-macos
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: biocontext-macos
          path: apps/tui/dist

      - name: Verify distribution
        run: bun run scripts/verify-dist.ts
        working-directory: apps/tui

      - name: Publish package
        run: bun publish --access public
        working-directory: apps/tui
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
